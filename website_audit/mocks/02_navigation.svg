    <line x1="0" y1="100" x2="1280" y2="100" stroke="#E6E0D3" stroke-width="1"/>

    <!-- Tab 1 — Saison 01 -->
    <g transform="translate(40, 56)">
      <rect x="-20" y="-2" width="20" height="20" fill="none" stroke="#0D0D0D" stroke-width="1.5" rx="1"/>
      <circle cx="-10" cy="9" r="4" fill="none" stroke="#0D0D0D" stroke-width="1.5"/>
      <circle cx="-4.5" cy="2" r="0.8" fill="#0D0D0D"/>
      <text x="12" y="13" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#0D0D0D" letter-spacing="1.5">SAISON 01</text>
    </g>

    <!-- Tab 2 — Calendrier (ACTIVE) -->

      <text x="0" y="22" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">&#8226; SVG inline · stroke 1.5 px · viewBox 24&#215;24</text>
      <text x="0" y="42" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">&#8226; Couleur via currentColor (h&#233;rite du parent CSS)</text>
      <text x="0" y="62" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">&#8226; &#201;tat actif : couleur bleue + soulignement 2 px</text>
      <text x="0" y="82" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">&#8226; Hover desktop : opacity 0.7 du parent</text>
      <text x="0" y="102" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">&#8226; Peut &#234;tre confi&#233; au graphiste t-shirt pour</text>
      <text x="0" y="120" font-family="Inter, sans-serif" font-size="13" fill="#5B5B5B">  coh&#233;rence parfaite avec l'univers DRC</text>

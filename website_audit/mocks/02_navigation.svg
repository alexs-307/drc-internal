    <text x="0" y="32" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#001EFF" letter-spacing="1.5">MOCK 02 · DIRECTION B</text>
  </g>

  <!-- ============== SECTION 1 : DESKTOP ============== -->
  <g transform="translate(80, 168)">

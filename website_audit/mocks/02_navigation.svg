        <path d="M-18 0 L-2 0 L-2 12 L-18 12 Z"/>
        <line x1="-14" y1="0" x2="-14" y2="12" stroke-width="0.5"/>
        <line x1="-10" y1="0" x2="-10" y2="12" stroke-width="0.5"/>
        <line x1="-6" y1="0" x2="-6" y2="12" stroke-width="0.5"/>
        <line x1="-18" y1="3" x2="-2" y2="3" stroke-width="0.5"/>
        <line x1="-18" y1="6" x2="-2" y2="6" stroke-width="0.5"/>
        <line x1="-18" y1="9" x2="-2" y2="9" stroke-width="0.5"/>
      </g>

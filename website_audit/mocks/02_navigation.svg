        <rect x="0" y="-12" width="14" height="14" fill="none" stroke="#0D0D0D" stroke-width="1.2"/>
        <circle cx="7" cy="-5" r="3" fill="none" stroke="#0D0D0D" stroke-width="1.2"/>

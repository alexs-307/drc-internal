      <g transform="translate(20, 30)" stroke="#001EFF" stroke-width="1.5" fill="none">
        <rect x="-8" y="-8" width="16" height="16" rx="1"/>
        <circle cx="0" cy="0" r="4"/>
      </g>
      <text x="48" y="36" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#001EFF" letter-spacing="1.5">SAISON 01</text>
      <line x1="0" y1="60" x2="120" y2="60" stroke="#001EFF" stroke-width="2"/>
      <text x="0" y="92" font-family="Inter, sans-serif" font-size="12" font-style="italic" fill="#5B5B5B">Actif (bleu + underline 2 px)</text>

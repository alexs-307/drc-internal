<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1500" font-family="Inter, system-ui, sans-serif">
<style>@import url("https://fonts.googleapis.com/css2?family=Anton&amp;family=Bebas+Neue&amp;family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap");</style>
  <defs>
    <!-- Duotone simulation for hero photo: deep blue gradient -->
    <linearGradient id="duotoneHero" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001EFF"/>
      <stop offset="100%" stop-color="#0D0D0D"/>
    </linearGradient>
    <!-- Cream-blue duotone for mosaic photos -->
    <linearGradient id="duoMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E6E0D3"/>
      <stop offset="100%" stop-color="#001EFF"/>
    </linearGradient>
    <linearGradient id="duoLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F4F1EC"/>
      <stop offset="100%" stop-color="#5B5B5B"/>
    </linearGradient>
  </defs>

  <rect width="1440" height="1500" fill="#F4F1EC"/>

  <!-- ============== HEADER (compact reminder) ============== -->
  <g transform="translate(80, 56)" opacity="0.4">
    <circle cx="24" cy="22" r="24" fill="#001EFF"/>
    <text x="24" y="32" text-anchor="middle" fill="#FFFFFF" font-family="Anton, Impact, sans-serif" font-size="28">D</text>
    <text x="64" y="20" font-family="Anton, Impact, sans-serif" font-size="32" fill="#0D0D0D" letter-spacing="-0.5">D&#201;RAPAGE</text>
    <text x="64" y="42" font-family="Anton, Impact, sans-serif" font-size="16" fill="#001EFF" letter-spacing="2">RUNNING CLUB</text>
  </g>

  <!-- Nav reminder (Saison 01 active) -->
  <g transform="translate(80, 156)" opacity="0.5">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#E6E0D3"/>
    <g transform="translate(0, 24)">
      <rect x="-2" y="-2" width="20" height="20" fill="none" stroke="#001EFF" stroke-width="1.5" rx="1"/>
      <circle cx="8" cy="9" r="4" fill="none" stroke="#001EFF" stroke-width="1.5"/>
      <text x="30" y="13" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#001EFF" letter-spacing="1.5">SAISON 01</text>
      <line x1="-2" y1="32" x2="120" y2="32" stroke="#001EFF" stroke-width="2"/>
    </g>
    <text x="160" y="37" font-family="JetBrains Mono, monospace" font-size="12" font-weight="600" fill="#0D0D0D" letter-spacing="1.5" opacity="0.5">CALENDRIER &#183; ENTRA&#206;NEMENT &#183; RESSOURCES</text>
  </g>

  <!-- ============== SECTION TITLE ============== -->
  <g transform="translate(80, 256)">
    <text font-family="Bebas Neue, Impact, sans-serif" font-size="120" fill="#0D0D0D" letter-spacing="-2">SAISON 01</text>
    <text x="0" y="80" font-family="Bebas Neue, Impact, sans-serif" font-size="120" fill="#001EFF" letter-spacing="-2">L'ALBUM</text>
    <text x="0" y="138" font-family="Inter, sans-serif" font-size="18" font-weight="400" fill="#0D0D0D">Aug 2025 &#8594; Juin 2026 · 36 s&#233;ances, 9 courses, des verres chez Pinettes, un week-end dans le Cantal.</text>
    <text x="0" y="162" font-family="JetBrains Mono, monospace" font-size="11" font-weight="600" fill="#5B5B5B" letter-spacing="2">EST. 2025 &#183; PARIS &#183; FFA</text>
  </g>

  <!-- ============== HERO FEATURE ============== -->
  <g transform="translate(80, 504)">
    <!-- Big duotone hero photo -->
    <rect x="0" y="0" width="780" height="440" fill="url(#duotoneHero)" rx="8"/>
    <!-- Inner photo subject hint -->
    <text x="40" y="60" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.4" letter-spacing="2">PHOTO_001 &#183; SHOOT_MONTMARTRE_VINCENT_03.JPG</text>
    <g transform="translate(390, 220)" opacity="0.18">
      <!-- Abstract runner silhouette -->
      <ellipse cx="0" cy="-60" rx="20" ry="22" fill="#FFFFFF"/>
      <path d="M-10 -36 L-30 30 M10 -36 L30 30 M0 -36 L0 60" stroke="#FFFFFF" stroke-width="14" fill="none" stroke-linecap="round"/>
    </g>
    <!-- Caption overlay bottom -->
    <rect x="0" y="380" width="780" height="60" fill="#001EFF"/>
    <text x="32" y="404" font-family="Bebas Neue, Impact, sans-serif" font-size="22" fill="#FFFFFF" letter-spacing="0">DRIFT AWARD &#8212; F&#202;TE DE NO&#203;L</text>
    <text x="32" y="424" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#FFFFFF" opacity="0.7" letter-spacing="1.5">12 D&#201;C 2025 &#183; PHOTO BY MARINE</text>

    <!-- Right column : meta + first row of small photos -->
    <g transform="translate(820, 0)">
      <text font-family="Bebas Neue, Impact, sans-serif" font-size="22" fill="#0D0D0D" letter-spacing="0">UN MOMENT, PARMI BEAUCOUP D'AUTRES.</text>
      <text x="0" y="28" font-family="Inter, sans-serif" font-size="14" fill="#5B5B5B">Premi&#232;re soir&#233;e de remise des prix maison. Marathon de</text>
      <text x="0" y="46" font-family="Inter, sans-serif" font-size="14" fill="#5B5B5B">remerciements, t-shirts, fous rires &#224; Pinettes. Le club avait</text>
      <text x="0" y="64" font-family="Inter, sans-serif" font-size="14" fill="#5B5B5B">six mois.</text>

      <!-- Two square photos stacked -->
      <rect x="0" y="100" width="200" height="160" fill="url(#duoMid)" rx="4"/>
      <text x="10" y="118" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">02 SEPT 2025</text>
      <text x="10" y="248" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#FFFFFF" letter-spacing="1">D&#201;COUVERTE CLUB</text>

      <rect x="220" y="100" width="200" height="160" fill="url(#duoLight)" rx="4"/>
      <text x="230" y="118" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">14 OCT 2025</text>
      <text x="230" y="248" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#FFFFFF" letter-spacing="1">TEST VMA #1</text>

      <rect x="0" y="280" width="420" height="160" fill="url(#duoMid)" rx="4"/>
      <text x="10" y="298" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">04—06 AVR 2026 &#183; CANTAL</text>
      <text x="10" y="428" font-family="Bebas Neue, Impact, sans-serif" font-size="22" fill="#FFFFFF" letter-spacing="0">SORTIE LONGUE &#8212; HAUT-CANTAL</text>
    </g>
  </g>

  <!-- ============== MOSAIC ROW 1 ============== -->
  <g transform="translate(80, 992)">
    <text font-family="Bebas Neue, Impact, sans-serif" font-size="32" fill="#0D0D0D" letter-spacing="0">PRINTEMPS 2026</text>
    <line x1="0" y1="14" x2="60" y2="14" stroke="#001EFF" stroke-width="3"/>
    <text x="80" y="14" font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#5B5B5B" letter-spacing="2">12 SEMAINES &#183; 4 COURSES PIVOT</text>

    <!-- Photo 1 wide -->
    <g transform="translate(0, 48)">
      <rect x="0" y="0" width="420" height="260" fill="url(#duoMid)" rx="4"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">17 MARS 2026</text>
      <text x="14" y="244" font-family="Bebas Neue, Impact, sans-serif" font-size="20" fill="#FFFFFF" letter-spacing="0">HYBRIDE SEUIL &#8594; VMA</text>
    </g>

    <!-- Photo 2 portrait tall -->
    <g transform="translate(440, 48)">
      <rect x="0" y="0" width="200" height="260" fill="url(#duotoneHero)" rx="4"/>
      <text x="10" y="20" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#FFFFFF" opacity="0.7" letter-spacing="1.5">02 MARS 2026</text>
      <text x="10" y="244" font-family="Bebas Neue, Impact, sans-serif" font-size="18" fill="#FFFFFF" letter-spacing="0">SEMI DE PARIS</text>
    </g>

    <!-- Photo 3 wide -->
    <g transform="translate(660, 48)">
      <rect x="0" y="0" width="320" height="260" fill="url(#duoLight)" rx="4"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">21 AVR 2026</text>
      <text x="14" y="244" font-family="Bebas Neue, Impact, sans-serif" font-size="20" fill="#FFFFFF" letter-spacing="0">CYCLE VMA &#183; PISTE</text>
    </g>

    <!-- Photo 4 square -->
    <g transform="translate(1000, 48)">
      <rect x="0" y="0" width="280" height="260" fill="url(#duoMid)" rx="4"/>
      <text x="14" y="20" font-family="JetBrains Mono, monospace" font-size="9" font-weight="600" fill="#0D0D0D" opacity="0.7" letter-spacing="1.5">12 MAI 2026</text>
      <text x="14" y="244" font-family="Bebas Neue, Impact, sans-serif" font-size="20" fill="#FFFFFF" letter-spacing="0">CL&#212;TURE DU CYCLE</text>
    </g>
  </g>

  <!-- ============== FOOTER LINK ============== -->
  <g transform="translate(80, 1376)">
    <line x1="0" y1="0" x2="1280" y2="0" stroke="#E6E0D3"/>
    <text x="0" y="32" font-family="Inter, sans-serif" font-size="16" fill="#0D0D0D">Le quotidien du club, c'est sur Instagram.</text>
    <g transform="translate(0, 56)">
      <text font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#001EFF" text-decoration="underline">&#8594; @derapagerunningclub</text>
    </g>
  </g>

  <!-- ============== ANNOTATION ============== -->
  <g transform="translate(80, 1460)">
    <text font-family="JetBrains Mono, monospace" font-size="10" font-weight="600" fill="#5B5B5B" letter-spacing="1.5">MOCK 03 · SAISON 01 · DIRECTION B · PHOTOS REPR&#201;SENT&#201;ES PAR DUOTONES &#8212; &#192; REMPLACER PAR ASSETS R&#201;ELS DE 07_PHOTOS</text>
  </g>
</svg>
